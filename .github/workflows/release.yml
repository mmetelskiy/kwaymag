name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libwayland-dev \
            pkg-config \
            libclang-dev \
            clang

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          tar -czf kwaymag-${{ github.ref_name }}-x86_64-linux.tar.gz \
            -C target/release kwaymag

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: kwaymag-${{ github.ref_name }}-x86_64-linux.tar.gz
